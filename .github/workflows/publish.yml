# Publishes to PyPI when a version tag (v*) is pushed. Uses PyPI trusted
# publishing (OIDC): no token is stored anywhere. Configure once on PyPI:
# project "pinnradar", owner "PinnRadar", repo "pinnradar-python",
# workflow "publish.yml", environment "pypi".
name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest build && pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
